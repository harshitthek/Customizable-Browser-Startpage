<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SECURITY: Content Security Policy to prevent XSS attacks -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; 
                   script-src 'self'; 
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                   img-src 'self' https: data:; 
                   connect-src 'self' https://api.github.com https://api.quotable.io https://www.google.com; 
                   font-src 'self' https://fonts.gstatic.com; 
                   frame-src 'none'; 
                   object-src 'none'; 
                   base-uri 'self';">
    <title>DailyCosmos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
    <script src="js/privacy.js" defer></script>
</head>

<body data-theme="slate">
    <!-- Theme Flash Prevention -->
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('savedTheme') || 'slate';
                document.body.dataset.theme = savedTheme;
                if (savedTheme === 'custom') {
                    var savedAccent = localStorage.getItem('customAccentColor');
                    if (savedAccent) document.body.style.setProperty('--accent-color', savedAccent);
                }
            } catch (e) {}
        })();
    </script>

    <!-- Particle Background -->
    <canvas id="particle-canvas"></canvas>

    <div class="dashboard-grid">
        <!-- LEFT COLUMN: Bookmarks, Quote card -->
        <div class="col-left">
            <section id="links-container"></section>
            <div id="quote-widget" class="widget">
                <p id="quote-text">"Loading..."</p>
                <span id="quote-author">- Author</span>
            </div>
        </div>

        <!-- CENTER COLUMN: Greeting, Clock, Search, Quick actions -->
        <main class="col-center">
            <div class="container">
                <h1 id="greeting">Good day, <span id="name" tabindex="0" role="button" aria-label="Change name">Guest</span></h1>
                <div id="clock" aria-live="polite">--:--:--</div>
                <button id="clock-settings-btn" class="clock-settings-icon" title="Clock Settings" aria-label="Clock Settings">⚙️</button>
                <div id="date"></div>
            </div>

            <!-- Main Search Bar -->
            <div id="main-search-container" role="search">
                <button id="search-engine-icon" title="Click to switch" aria-label="Switch search engine" style="background:none;border:none;padding:0;">
                    <img src="https://www.google.com/favicon.ico" alt="Search" id="engine-icon">
                </button>
                <input type="text" id="main-search-input" placeholder="Search the web..." aria-label="Search query">
                <button id="search-btn" title="Search" aria-label="Search">🔍</button>
            </div>
        </main>

        <!-- RIGHT COLUMN: Settings actions, GitHub -->
        <div class="col-right">
            <!-- Top Right UI Controls -->
            <div class="top-right-controls" role="toolbar" aria-label="Main controls">
                <button id="add-link-btn" title="Add New Link" aria-label="Add New Link">➕</button>
                <button id="bg-settings-btn" title="Background Settings" aria-label="Background Settings">🖼️</button>
                <button id="theme-btn" title="Change theme" aria-label="Change theme">🌈</button>
                <button id="privacy-btn" title="Privacy & Security" aria-label="Privacy & Security">🔒</button>
            </div>

            <div id="github-panel">
                <div id="github-widget" class="widget">
                    <h3 class="widget-title">💻 GitHub</h3>
                    <div id="github-profile">
                        <div class="gh-profile-loading">Loading...</div>
                    </div>
                    <div id="github-repos"></div>
                    <input type="text" id="gh-username-input" placeholder="GitHub username">
                    <button id="gh-update-btn" class="btn-primary">Update</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Panels, Modals, and Audio -->
    <div id="toast-container" aria-live="polite"></div>
    <div id="context-menu" class="panel hidden" role="menu">
        <button id="context-edit-btn" role="menuitem">✏️ Edit</button>
        <button id="context-delete-btn" role="menuitem">❌ Delete</button>
    </div>

    <div id="theme-panel" class="panel hidden" role="region" aria-label="Theme settings">
        <h3>Themes</h3>
        <button class="theme-option" data-theme="slate">Dark Slate</button>
        <button class="theme-option" data-theme="light">Light</button>
        <button class="theme-option" data-theme="ocean">Ocean</button>
        <button class="theme-option" data-theme="cyberpunk">🌃 Cyberpunk</button>
        <button class="theme-option" data-theme="sunset">🌅 Sunset</button>
        <button class="theme-option" data-theme="forest">🌲 Forest</button>
        <button class="theme-option" data-theme="aurora">✨ Aurora Wave</button>
        <button class="theme-option" data-theme="northern">🌌 Northern Lights</button>
        <button class="theme-option" data-theme="midnight">🌙 Midnight</button>
        <button class="theme-option" data-theme="rosegold">🌹 Rose Gold</button>
        <button class="theme-option" id="custom-theme-btn">Custom</button>

        <!-- THIS WAS MISSING - ADDED BACK -->
        <div id="custom-theme-panel" class="hidden">
            <div class="color-picker-group">
                <label for="accent-color-input">Accent Color</label>
                <input type="color" id="accent-color-input" value="#3b82f6">
            </div>
            <div class="form-buttons">
                <button type="button" class="btn-primary" id="save-custom-theme-btn">Save</button>
                <button type="button" class="btn-secondary" id="back-to-themes-btn">Back</button>
            </div>
        </div>
    </div>

    <div id="bg-settings-panel" class="panel hidden" role="region" aria-label="Background settings">
        <h3>Background Settings</h3>
        <div class="form-group">
            <label>Upload Image</label>
            <input type="file" id="bg-image-upload" accept="image/*">
        </div>
        <div class="form-group">
            <label>Or Image URL</label>
            <input type="text" id="bg-image-url" placeholder="https://example.com/image.jpg">
            <button type="button" class="btn-primary" id="apply-bg-url">Apply</button>
        </div>
        <div class="form-group">
            <label>Blur: <span id="blur-value">5</span>px</label>
            <input type="range" id="bg-blur" min="0" max="20" value="5">
        </div>
        <div class="form-group">
            <label>Brightness: <span id="brightness-value">100</span>%</label>
            <input type="range" id="bg-brightness" min="50" max="150" value="100">
        </div>
        <button type="button" class="btn-secondary" id="reset-bg-btn">Reset to Gradient</button>
        <hr style="margin: 20px 0; border: 1px solid rgba(255,255,255,0.1);">
        <h4 style="font-size: 14px; margin-bottom: 10px;">Backup & Restore</h4>
        <button type="button" class="btn-primary" id="export-settings-btn" style="width: 100%; margin-bottom: 8px;">⬇️
            Export All Settings</button>
        <input type="file" id="import-settings-input" accept=".json" style="display: none;">
        <button type="button" class="btn-secondary" id="import-settings-btn" style="width: 100%;">⬆️ Import
            Settings</button>
    </div>

    <div id="clock-settings-panel" class="panel hidden" role="region" aria-label="Clock settings">
        <button class="close-btn" aria-label="Close panel">&times;</button>
        <h3>Clock Settings</h3>
        <div class="form-group">
            <label>
                <input type="checkbox" id="clock-24hr"> 24-hour format
            </label>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" id="clock-seconds" checked> Show seconds
            </label>
        </div>
    </div>

    <div id="add-link-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content panel">
            <button class="close-btn" aria-label="Close modal">&times;</button>
            <h2 id="modal-title">Add New Link</h2>
            <form id="add-link-form" novalidate>
                <div class="form-group">
                    <label for="link-name">Name</label>
                    <input type="text" id="link-name-input" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="link-url">URL</label>
                    <input type="url" id="link-url-input" placeholder="https://example.com" required autocomplete="off">
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn-primary" id="modal-submit-btn">Add Link</button>
                    <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="privacy-panel" class="panel hidden" role="region" aria-label="Privacy settings">
        <h3>Privacy & Security</h3>
        <p>All data stored locally. No tracking.</p>
        <button id="clear-all-data-btn" class="btn-danger">Clear All Data</button>
    </div>

</body>

</html>
